<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat Ivoire</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FF8C00">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#fff;padding-bottom:70px}
.top{position:fixed;top:0;left:0;right:0;background:#FF8C00;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;z-index:100}
.top b{color:#fff;font-size:22px}
.page{display:none;padding-top:55px}.page.active{display:block}
.chat{display:flex;padding:12px;border-bottom:1px solid #f0f0f0;align-items:center}
.chat img{width:50px;height:50px;border-radius:50%;margin-right:12px}
.bot{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid #FF8C00;display:flex;z-index:90}
.bot button{flex:1;padding:10px 2px;border:0;background:#fff;font-size:11px;color:#666}
.bot button.active{color:#FF8C00;font-weight:bold;border-top:3px solid #FF8C00}
.bot button i{font-size:22px;display:block;font-style:normal}
.install{margin:20px;text-align:center;background:#FFF3E0;padding:20px;border-radius:15px;border:2px dashed #FF8C00}
</style>
</head>
<body>
<div class="top"><b>Chat Ivoire 🧡</b></div>

<div id="p-disc" class="page active">
<div class="chat"><img src="https://i.pravatar.cc/100?img=5"><div><b>Séverine</b><br><small>Salut - App orange!</small></div></div>

<div class="install">
<h3 style="color:#FF8C00">🧡 Chat Ivoire est prêt!</h3><br>
<p>Ton application est maintenant téléchargeable!</p><br>
<button onclick="alert('Sur téléphone: Chrome Menu ⋮ > Installer l application\nSur PC: icone Installer en haut')" style="background:#FF8C00;color:#fff;padding:14px 22px;border:0;border-radius:25px;font-weight:bold;font-size:16px">📲 INSTALLER</button>
<br><br><small>Après installation, elle sera sur ton bureau comme WhatsApp</small>
</div>
</div>

<div class="bot">
<button class="active"><i>💬</i>Discussions</button>
<button><i>⭕</i>Actus</button>
<button><i>👥</i>Communautés</button>
<button><i>📞</i>Appels</button>
</div>

<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}
</script>
</body>
</html>
