<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat Ivoire - Inscription</title>
<style>
body{font-family:Arial;background:#f0f2f5;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
.box{background:white;padding:25px;border-radius:15px;box-shadow:0 4px 15px rgba(0,0,0,.1);width:90%;max-width:350px}
h2{text-align:center;color:#FF8C00}
input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}
button{width:100%;padding:12px;background:#FF8C00;color:white;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:10px}
button:hover{background:#e67e00}
.link{text-align:center;margin-top:15px;font-size:14px}
.link a{color:#FF8C00;cursor:pointer;text-decoration:none}
#chat{display:none;flex-direction:column;height:100vh;width:100%;max-width:500px;background:white}
#messages{flex:1;overflow-y:auto;padding:15px}
.msg{margin:8px 0;padding:8px 12px;background:#f0f0f0;border-radius:12px}
.msg b{color:#FF8C00}
#form{display:flex;padding:10px;border-top:1px solid #ddd}
#input{flex:1}
#header{padding:15px;background:#FF8C00;color:white;display:flex;justify-content:space-between}
</style>
</head>
<body>

<div class="box" id="authBox">
  <h2>🇨🇮 Chat Ivoire</h2>
  <div id="registerForm">
    <input id="pseudo" placeholder="Ton pseudo">
    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Mot de passe">
    <button onclick="register()">S'inscrire</button>
    <div class="link">Déjà inscrit ? <a onclick="showLogin()">Se connecter</a></div>
  </div>
  <div id="loginForm" style="display:none">
    <input id="loginEmail" placeholder="Email">
    <input id="loginPassword" type="password" placeholder="Mot de passe">
    <button onclick="login()">Connexion</button>
    <div class="link">Pas de compte ? <a onclick="showRegister()">S'inscrire</a></div>
  </div>
  <p id="error" style="color:red;text-align:center"></p>
</div>

<div id="chat">
  <div id="header"><span id="myPseudo"></span><span onclick="logout()" style="cursor:pointer">Déconnexion</span></div>
  <div id="messages"></div>
  <form id="form"><input id="input" autocomplete="off" placeholder="Message..."><button>Envoyer</button></form>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
let token = localStorage.getItem('token');
let myPseudo = localStorage.getItem('pseudo');

function showLogin(){ document.getElementById('registerForm').style.display='none'; document.getElementById('loginForm').style.display='block'; }
function showRegister(){ document.getElementById('loginForm').style.display='none'; document.getElementById('registerForm').style.display='block'; }

if(token){ enterChat(); }

async function register(){
  const res = await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pseudo:pseudo.value,email:email.value,password:password.value})});
  const data = await res.json();
  if(data.error) return document.getElementById('error').innerText=data.error;
  localStorage.setItem('token',data.token); localStorage.setItem('pseudo',data.pseudo); token=data.token; myPseudo=data.pseudo; enterChat();
}
async function login(){
  const res = await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:loginEmail.value,password:loginPassword.value})});
  const data = await res.json();
  if(data.error) return document.getElementById('error').innerText=data.error;
  localStorage.setItem('token',data.token); localStorage.setItem('pseudo',data.pseudo); token=data.token; myPseudo=data.pseudo; enterChat();
}
function enterChat(){
  document.getElementById('authBox').style.display='none';
  document.getElementById('chat').style.display='flex';
  document.getElementById('myPseudo').innerText='🇨🇮 '+ (localStorage.getItem('pseudo')||'');
}
function logout(){ localStorage.clear(); location.reload(); }

document.getElementById('form').addEventListener('submit', e=>{
  e.preventDefault();
  if(input.value){ socket.emit('chat message',{token,text:input.value}); input.value=''; }
});
socket.on('old_messages', msgs=>{ msgs.forEach(addMsg); });
socket.on('chat message', addMsg);
function addMsg(m){ const div=document.createElement('div'); div.className='msg'; div.innerHTML=`<b>${m.pseudo}:</b> ${m.text}`; messages.appendChild(div); messages.scrollTop=messages.scrollHeight; }
</script>
</body>
</html>
