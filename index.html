<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Ivoire</title>
<style>
body{margin:0;font-family:Arial;background:#f2f2f2;display:flex;flex-direction:column;height:100vh}
header{background:#ff8c00;color:white;padding:15px;display:flex;justify-content:space-between;align-items:center}
#messages{flex:1;overflow-y:auto;padding:10px;list-style:none;padding-bottom:90px;margin:0}
#messages li{padding:12px;background:white;margin:5px;border-radius:10px;max-width:80%}
#messages li.me{background:#dcf8c6;margin-left:auto}
#form{display:flex;gap:8px;padding:10px;background:white;position:fixed;bottom:0;width:100%;box-sizing:border-box}
#input{flex:1;padding:12px;border-radius:20px;border:1px solid #ccc}
button{padding:12px 18px;border:none;border-radius:20px;background:#ff8c00;color:white;font-weight:bold}
#mic{background:#25D366}
#mic.rec{background:red;animation:pulse 1s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
</style>
</head>
<body>
<header><b>🇨🇮 Chat Ivoire</b><span id="status">En ligne</span></header>
<ul id="messages"></ul>
<form id="form">
<input id="input" autocomplete="off" placeholder="Message..." />
<button type="button" id="mic">🎤</button>
<button>Envoyer</button>
</form>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const form = document.getElementById('form');
const input = document.getElementById('input');
const messages = document.getElementById('messages');
const micBtn = document.getElementById('mic');

form.addEventListener('submit', (e)=>{
 e.preventDefault();
 if(input.value){ socket.emit('chat message', input.value); input.value=''; }
});

socket.on('chat message', (msg)=>{
 const li = document.createElement('li');
 li.textContent = msg;
 messages.appendChild(li);
 window.scrollTo(0, document.body.scrollHeight);
});

// VOCAL
let rec;
if('webkitSpeechRecognition' in window || 'SpeechRecognition' in window){
 const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
 rec = new SR();
 rec.lang='fr-FR';
 rec.onstart=()=>micBtn.classList.add('rec');
 rec.onend=()=>micBtn.classList.remove('rec');
 rec.onresult=(e)=>{ input.value = e.results[0][0].transcript; form.requestSubmit(); };
}
micBtn.onclick=()=>{ if(rec) rec.start(); else alert('Micro non supporté sur ce navigateur'); };
</script>
</body>
</html>
