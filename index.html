<!DOCTYPE html><html><body>
<div id="d">Discussions Grace</div>
<div id="p2" style="display:none">Personnes</div>
<div id="n" style="display:none">Notifs</div>
<div id="me" style="display:none">Menu</div>
<div style="position:fixed;bottom:0;display:flex;width:100%;background:#fff;border-top:1px solid #ddd">
<div onclick="show('d')" style="flex:1;text-align:center;padding:10px">Discussions</div>
<div onclick="show('p2')" style="flex:1;text-align:center;padding:10px">Personnes</div>
<div onclick="show('n')" style="flex:1;text-align:center;padding:10px">Notifs</div>
<div onclick="show('me')" style="flex:1;text-align:center;padding:10px">Menu</div>
</div>
<script>function show(x){d.style.display='none';p2.style.display='none';n.style.display='none';me.style.display='none';document.getElementById(x).style.display='block';}</script>
</body></html>
