<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat Ivoire</title><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#fff;padding-bottom:70px}
.top{position:fixed;top:0;left:0;right:0;background:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ddd;z-index:100}
.top b{color:#FF8C00;font-size:22px}.top b span{color:#009E60}
.page{display:none;padding-top:50px}.page.active{display:block}
.chat{display:flex;padding:12px;border-bottom:1px solid #f0f0f0;align-items:center;cursor:pointer}
.chat img{width:50px;height:50px;border-radius:50%;margin-right:12px}
.bot{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;z-index:90}
.bot button{flex:1;padding:10px 2px;border:0;background:#fff;font-size:11px;color:#666}.bot button.active{color:#FF8C00;font-weight:bold}.bot button i{font-size:22px;display:block;font-style:normal}
#video{width:100%;height:60vh;background:#000;object-fit:cover}
.controls{background:#222;padding:12px;display:flex;justify-content:space-around;flex-wrap:wrap;gap:6px}.controls button{padding:10px 14px;border-radius:20px;border:0;color:#fff;background:#FF8C00}
#chatWin{position:fixed;top:0;left:0;right:0;bottom:0;background:#e5ddd5;z-index:200;display:none;flex-direction:column}
#chatHead{background:#008069;color:#fff;padding:10px;display:flex;align-items:center}
#msgs{flex:1;overflow-y:auto;padding:10px}
.msg{background:#fff;padding:8px 10px;border-radius:8px;margin:6px 0;max-width:75%;font-size:14px}.msg.me{background:#d9fdd3;margin-left:auto}
#inputBar{display:flex;padding:8px;background:#f0f0f0;align-items:center}
#inputBar input{flex:1;padding:10px;border-radius:20px;border:0;outline:none}
#inputBar button{width:42px;height:42px;border-radius:50%;border:0;background:#008069;color:#fff;margin-left:6px;font-size:18px}
#callScreen{position:fixed;top:0;left:0;right:0;bottom:0;background:#111;color:#fff;z-index:300;display:none;flex-direction:column;align-items:center;justify-content:center}
</style></head><body>
<div class="top"><b>Chat <span>Ivoire</span></b><div><button onclick="showCam()" style="border:0;background:none;font-size:22px">📷</button> ⋮</div></div>
<div id="p-disc" class="page active">
<div class="chat" onclick="openChat('Séverine')"><img src="https://i.pravatar.cc/100?img=5"><div><b>Séverine</b><br><small>Bonsoir</small></div><div style="margin-left:auto"><button onclick="event.stopPropagation();startCall('Séverine')" style="background:#009E60;color:#fff;border:0;border-radius:50%;width:32px;height:32px">📞</button></div></div>
<div class="chat" onclick="openChat('Famille')"><img src="https://i.pravatar.cc/100?img=15"><div><b>Famille KLANDJIN</b><br><small>Salut</small></div></div>
</div>
<div id="p-actus" class="page"><div style="padding:16px"><h3>Actus</h3><br>🎥 La vidéo marche maintenant!</div></div>
<div id="p-com" class="page"><div style="padding:16px"><h3>Communautés</h3></div></div>
<div id="p-appels" class="page"><div style="padding:16px"><h3>Appels</h3><div class="chat" onclick="startCall('Séverine')"><img src="https://i.pravatar.cc/100?img=5"><div><b>Séverine</b><br><small>Appel vocal</small></div></div></div></div>
<div id="p-cam" class="page"><video id="video" autoplay playsinline muted></video><div class="controls"><button onclick="switchCam()">🔄 Avant/Arrière</button><button onclick="closeCam()">❌ Fermer</button><button onclick="snap()">📸 Photo</button><button onclick="recordVideo()" id="recBtn" style="background:red">🎬 Filmer</button></div><canvas id="canvas" style="display:none"></canvas></div>
<div id="chatWin"><div id="chatHead"><button onclick="closeChat()" style="background:none;border:0;color:#fff;font-size:22px;margin-right:12px">←</button><b id="chatName">Chat</b><button onclick="startCall(document.getElementById('chatName').innerText)" style="margin-left:auto;background:none;border:0;color:#fff;font-size:20px">📞</button></div><div id="msgs"></div><div id="inputBar"><input id="txt" placeholder="Message"><button onclick="recVocal()" id="micBtn">🎤</button><button onclick="sendMsg()">➤</button></div></div>
<div id="callScreen"><img src="https://i.pravatar.cc/200?img=5" style="width:100px;height:100px;border-radius:50%"><h2 id="callName">Séverine</h2><p id="timer">00:00</p><div><button onclick="endCall()" style="background:red;color:#fff;padding:12px 20px;border-radius:30px;border:0">❌ Raccrocher</button></div></div>
<div class="bot"><button id="btn-disc" class="active" onclick="openPage('p-disc','btn-disc')"><i>💬</i>Discussions</button><button id="btn-actus" onclick="openPage('p-actus','btn-actus')"><i>⭕</i>Actus</button><button id="btn-com" onclick="openPage('p-com','btn-com')"><i>👥</i>Communautés</button><button id="btn-appels" onclick="openPage('p-appels','btn-appels')"><i>📞</i>Appels</button></div>
<script>
let stream=null,mode="user",lastPage="p-disc",callInterval=null,sec=0,mediaRec=null,audioChunks=[],videoRec=null,chunks=[],isRec=false;
function openPage(pid,bid){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(pid).classList.add('active');document.querySelectorAll('.bot button').forEach(b=>b.classList.remove('active'));document.getElementById(bid).classList.add('active');lastPage=pid}
async function showCam(){lastPage=document.querySelector('.page.active').id;document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById('p-cam').classList.add('active');try{if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:mode},audio:true});document.getElementById('video').srcObject=stream}catch(e){alert('Autorise caméra + micro')}}
function closeCam(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}document.getElementById('p-cam').classList.remove('active');document.getElementById(lastPage).classList.add('active')}
function switchCam(){mode=mode==="user"?"environment":"user";showCam()}
function snap(){let v=document.getElementById('video'),c=document.getElementById('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);let a=document.createElement('a');a.download='chat_ivoire.jpg';a.href=c.toDataURL();a.click()}
function recordVideo(){let btn=document.getElementById('recBtn');if(!isRec){chunks=[];videoRec=new MediaRecorder(stream);videoRec.ondataavailable=e=>chunks.push(e.data);videoRec.onstop=()=>{let blob=new Blob(chunks,{type:'video/webm'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download='chat_ivoire_video.webm';a.click();alert('🎉 Vidéo enregistrée!')};videoRec.start();isRec=true;btn.innerText='⏹️ STOP';btn.style.background='#000'}else{videoRec.stop();isRec=false;btn.innerText='🎬 Filmer';btn.style.background='red'}}
function openChat(name){document.getElementById('chatName').innerText=name;document.getElementById('chatWin').style.display='flex';document.getElementById('msgs').innerHTML='<div class=msg>Salut c\'est '+name+'!</div>'}
function closeChat(){document.getElementById('chatWin').style.display='none'}
function sendMsg(){let t=document.getElementById('txt');if(!t.value)return;let m=document.createElement('div');m.className='msg me';m.innerText=t.value;document.getElementById('msgs').appendChild(m);t.value="";document.getElementById('msgs').scrollTop=9999}
async function recVocal(){let btn=document.getElementById('micBtn');if(mediaRec&&mediaRec.state=="recording"){mediaRec.stop();btn.innerText="🎤";return}try{let s=await navigator.mediaDevices.getUserMedia({audio:true});mediaRec=new MediaRecorder(s);audioChunks=[];mediaRec.ondataavailable=e=>audioChunks.push(e.data);mediaRec.onstop=()=>{let blob=new Blob(audioChunks,{type:'audio/webm'});let url=URL.createObjectURL(blob);let div=document.createElement('div');div.className='msg me';div.innerHTML='🎤 Vocal <audio controls src="'+url+'"></audio>';document.getElementById('msgs').appendChild(div);s.getTracks().forEach(t=>t.stop())};mediaRec.start();btn.innerText="⏹️"}catch(e){alert("Autorise micro")}}
function startCall(name){document.getElementById('callName').innerText=name;document.getElementById('callScreen').style.display='flex';sec=0;callInterval=setInterval(()=>{sec++;let m=String(Math.floor(sec/60)).padStart(2,'0');let s=String(sec%60).padStart(2,'0');document.getElementById('timer').innerText=m+":"+s},1000)}
function endCall(){clearInterval(callInterval);document.getElementById('callScreen').style.display='none';alert('Appel terminé: '+sec+' sec')}
</script></body></html>
