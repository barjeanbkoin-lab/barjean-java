<!DOCTYPE html>
<html>
<head>
<title>Chat Ivoire - BARJEAN 🇨🇮</title>
<style>
body{margin:0;font-family:Arial;background:#FFF8E7}
.header{background:linear-gradient(90deg,#FF8200 0%,#fff 50%,#00A651 100%);padding:15px;text-align:center;color:#000;font-weight:bold;font-size:22px;border-bottom:4px solid #000}
#messages{height:80vh;overflow-y:auto;padding:15px}
.msg{padding:10px;margin:8px;border-radius:15px;max-width:70%}
.me{background:#FF8200;color:white;margin-left:auto}
.other{background:white;border:1px solid #ddd}
#form{display:flex;padding:10px;background:white;position:fixed;bottom:0;width:100%}
input{flex:1;padding:12px;border-radius:25px;border:2px solid #00A651}
button{background:#00A651;color:white;border:none;padding:12px 20px;border-radius:25px;margin-left:10px;font-weight:bold}
</style>
</head>
<body>
<div class="header">🇨🇮 Chat Ivoire - BARJEAN 🇨🇮</div>
<div id="messages"></div>
<form id="form"><input id="input" placeholder="Ecris un message..."/><button>Envoyer</button></form>
<audio id="son" src="https://cdn.pixabay.com/audio/2022/03/10/audio_c8c8a650cd.mp3"></audio>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket=io();const form=document.getElementById('form');const input=document.getElementById('input');const messages=document.getElementById('messages');const son=document.getElementById('son');
form.addEventListener('submit',e=>{e.preventDefault();if(input.value){socket.emit('chat message',input.value);input.value=''}});
socket.on('chat message',msg=>{const div=document.createElement('div');div.textContent=msg;div.className='msg other';messages.appendChild(div);son.play();messages.scrollTop=messages.scrollHeight});
</script>
</body>
</html>
