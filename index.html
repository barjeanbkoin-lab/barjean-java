<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat Ivoire - Le Facebook Ivoirien 🇨🇮</title>
<style>
body{margin:0;font-family:Arial;background:#f0f2f5}
.header{background:#ff6a00;color:white;padding:12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.viral{background:#111;color:#fff;text-align:center;padding:8px;font-weight:bold;font-size:14px}
.btn{padding:8px 12px;border:none;border-radius:8px;font-weight:bold;cursor:pointer}
.btn-orange{background:#ff6a00;color:#fff}
.btn-green{background:#25D366;color:#fff}
.card{background:white;margin:10px;border-radius:12px;padding:12px;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.posts{padding-bottom:80px}
</style>
</head>
<body>
<div class="viral">🔥 1,247 Ivoiriens en ligne • 🇨🇮 100% CI • Invite tes amis!</div>
<div class="header">
<b>Chat Ivoire 🇨🇮</b>
<div><button class="btn btn-orange" onclick="post()">+ Publier</button> <button class="btn btn-green" onclick="share()">WhatsApp</button></div>
</div>
<div class="card"><b>🎉 Bienvenue sur Chat Ivoire!</b><br>Le réseau 100% Ivoirien créé à Abidjan. Publie ta première photo!</div>
<div id="posts" class="posts"></div>
<script>
function post(){
 let t=prompt("Qu'est ce que tu veux dire à la Côte d'Ivoire? 🇨🇮");
 if(!t)return;
 let d=document.createElement("div");
 d.className="card";
 d.innerHTML="<b>Toi - Maintenant 🇨🇮</b><br><br>"+t;
 document.getElementById("posts").prepend(d);
}
function share(){
 let url=window.location.href;
 window.open("https://wa.me/?text=Rejoins%20Chat%20Ivoire%20🇨🇮%20Le%20Facebook%20Ivoirien!%20"+encodeURIComponent(url));
}
</script>
</body>
</html>
