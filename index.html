<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Ivoire - BARJEAN</title>
<style>
body{margin:0;font-family:Arial;background:#e5ddd5}
.header{background:#075e54;color:white;padding:15px;font-size:20px;font-weight:bold;position:fixed;top:0;width:100%;z-index:10}
#messages{padding:80px 15px 70px 15px;list-style:none;margin:0}
#messages li{background:white;padding:10px 15px;border-radius:10px;margin-bottom:10px;max-width:70%;box-shadow:0 1px 1px #ccc}
#messages li.moi{background:#dcf8c6;margin-left:auto}
.form{position:fixed;bottom:0;width:100%;display:flex;background:#f0f0f0;padding:10px;box-sizing:border-box}
#input{flex:1;padding:12px;border-radius:25px;border:1px solid #ccc;outline:none}
button{background:#075e54;color:white;border:none;padding:12px 20px;border-radius:25px;margin-left:10px;font-weight:bold}
</style>
</head>
<body>
<div class="header">💬 Chat Ivoire - BARJEAN</div>
<ul id="messages"></ul>
<div class="form">
<input id="input" placeholder="Écris un message..." autocomplete="off"/>
<button onclick="send()">Envoyer</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const messages = document.getElementById('messages');
const input = document.getElementById('input');

socket.on('old_messages', (msgs) => { msgs.forEach(addMessage); });
socket.on('new_message', (data) => { addMessage(data); });

function addMessage(data){
  const li = document.createElement('li');
  li.textContent = data;
  messages.appendChild(li);
  window.scrollTo(0, document.body.scrollHeight);
}

function send(){
  if(input.value){
    socket.emit('new_message', input.value);
    input.value = '';
  }
}
input.addEventListener('keypress', (e)=>{ if(e.key==='Enter') send(); });
</script>
</body>
</html>
