<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat Ivoire</title><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#fff;padding-bottom:70px}
.top{position:fixed;top:0;left:0;right:0;background:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ddd;z-index:100}
.top b{color:#FF8C00;font-size:22px}.top b span{color:#009E60}
.page{display:none;padding-top:50px}.page.active{display:block}
.chat{display:flex;padding:12px;border-bottom:1px solid #f0f0f0;align-items:center;cursor:pointer}
.chat img{width:50px;height:50px;border-radius:50%;margin-right:12px}
.bot{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;z-index:90}
.bot button{flex:1;padding:10px 2px;border:0;background:#fff;font-size:11px;color:#666}.bot button.active{color:#FF8C00;font-weight:bold}.bot button i{font-size:22px;display:block;font-style:normal}
#video{width:100%;height:55vh;background:#000;object-fit:cover}
.controls{background:#222;padding:12px;display:flex;justify-content:space-around;flex-wrap:wrap;gap:6px}.controls button{padding:10px 12px;border-radius:20px;border:0;color:#fff;background:#FF8C00;font-size:13px}
#chatWin{position:fixed;top:0;left:0;right:0;bottom:0;background:#e5ddd5;z-index:200;display:none;flex-direction:column}
#chatHead{background:#008069;color:#fff;padding:10px;display:flex;align-items:center}
#msgs{flex:1;overflow-y:auto;padding:10px}
.msg{background:#fff;padding:8px;border-radius:8px;margin:6px 0;max-width:80%;font-size:14px}.msg.me{background:#d9fdd3;margin-left:auto}
.msg img{width:100%;border-radius:8px;margin-top:5px}.msg video{width:100%;border-radius:8px}
#inputBar{display:flex;padding:8px;background:#f0f0f0;align-items:center}
#inputBar input{flex:1;padding:10px;border-radius:20px;border:0;outline:none}
#inputBar button{width:38px;height:38px;border-radius:50%;border:0;background:#008069;color:#fff;margin-left:4px;font-size:16px}
#previewBox{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.9);z-index:500;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px}
#previewBox img,#previewBox video{max-width:90%;max-height:60vh;border-radius:10px}
#callScreen{position:fixed;top:0;left:0;right:0;bottom:0;background:#111;color:#fff;z-index:300;display:none;flex-direction:column;align-items:center;justify-content:center}
</style></head><body>
<div class="top"><b>Chat <span>Ivoire</span></b><div><button onclick="showCam()" style="border:0;background:none;font-size:22px">📷</button> ⋮</div></div>
<div id="p-disc" class="page active">
<div class="chat" onclick="openChat('Séverine')"><img src="https://i.pravatar.cc/100?img=5"><div><b>Séverine</b><br><small id="last">Clique pour partager image/vidéo</small></div></div>
</div>
<div id="p-actus" class="page"><div style="padding:16px">Actus OK</div></div><div id="p-com" class="page"><div style="padding:16px">Communautés</div></div><div id="p-appels" class="page"><div style="padding:16px">Appels</div></div>
<div id="p-cam" class="page"><video id="video" autoplay playsinline muted></video><div class="controls"><button onclick="switchCam()">🔄</button><button onclick="closeCam()">❌</button><button onclick="snap()">📸 Photo</button><button onclick="recordVideo()" id="recBtn" style="background:red">🎬 Filmer</button></div><canvas id="canvas" style="display:none"></canvas></div>

<div id="previewBox"><div id="prevContent"></div><br><div><button onclick="shareMedia()" style="background:#009E60;color:#fff;padding:12px 20px;border-radius:20px;border:0">📤 Partager dans Chat Ivoire</button><button onclick="closePreview()" style="background:#555;color:#fff;padding:12px 20px;border-radius:20px;border:0;margin-left:10px">❌ Fermer</button></div><br><a id="dlBtn" download style="color:#fff">⬇️ Télécharger aussi</a></div>

<div id="chatWin"><div id="chatHead"><button onclick="closeChat()" style="background:none;border:0;color:#fff;font-size:22px;margin-right:12px">←</button><b id="chatName">Séverine</b></div><div id="msgs"><div class="msg">Envoie image ou vidéo 📸🎥</div></div><div id="inputBar"><button onclick="document.getElementById('fileInput').click()" style="background:#FF8C00">📎</button><input id="txt" placeholder="Message"><button onclick="recVocal()" id="micBtn">🎤</button><button onclick="sendMsg()">➤</button></div><input type="file" id="fileInput" accept="image/*,video/*" style="display:none" onchange="shareFile(this)"></div>

<div id="callScreen"><h2 id="callName">Séverine</h2><p id="timer">00:00</p><button onclick="endCall()" style="background:red;color:#fff;padding:12px 20px;border-radius:30px;border:0">❌ Raccrocher</button></div>
<div class="bot"><button id="btn-disc" class="active" onclick="openPage('p-disc','btn-disc')"><i>💬</i>Discussions</button><button id="btn-actus" onclick="openPage('p-actus','btn-actus')"><i>⭕</i>Actus</button><button id="btn-com" onclick="openPage('p-com','btn-com')"><i>👥</i>Communautés</button><button id="btn-appels" onclick="openPage('p-appels','btn-appels')"><i>📞</i>Appels</button></div>

<script>
let stream=null,mode="user",lastPage="p-disc",sec=0,callInt=null,mediaRec=null,audioChunks=[],videoRec=null,chunks=[],isRec=false,lastCapturedUrl=null,lastCapturedType=null;
function openPage(pid,bid){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(pid).classList.add('active');document.querySelectorAll('.bot button').forEach(b=>b.classList.remove('active'));document.getElementById(bid).classList.add('active');lastPage=pid}
async function showCam(){lastPage=document.querySelector('.page.active').id;document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById('p-cam').classList.add('active');try{if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:mode},audio:true});document.getElementById('video').srcObject=stream}catch(e){alert('Autorise caméra')}}
function closeCam(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}document.getElementById('p-cam').classList.remove('active');document.getElementById(lastPage).classList.add('active')}
function switchCam(){mode=mode==="user"?"environment":"user";showCam()}
function snap(){let v=document.getElementById('video'),c=document.getElementById('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);let url=c.toDataURL('image/jpeg');lastCapturedUrl=url;lastCapturedType='image';document.getElementById('prevContent').innerHTML='<img src="'+url+'">';document.getElementById('dlBtn').href=url;document.getElementById('dlBtn').download='photo_ivoire.jpg';document.getElementById('previewBox').style.display='flex'}
function recordVideo(){let btn=document.getElementById('recBtn');if(!isRec){chunks=[];videoRec=new MediaRecorder(stream);videoRec.ondataavailable=e=>chunks.push(e.data);videoRec.onstop=()=>{let blob=new Blob(chunks,{type:'video/webm'});let url=URL.createObjectURL(blob);lastCapturedUrl=url;lastCapturedType='video';document.getElementById('prevContent').innerHTML='<video src="'+url+'" controls autoplay></video>';document.getElementById('dlBtn').href=url;document.getElementById('dlBtn').download='video_ivoire.webm';document.getElementById('previewBox').style.display='flex'};videoRec.start();isRec=true;btn.innerText='⏹️ STOP';btn.style.background='#000'}else{videoRec.stop();isRec=false;btn.innerText='🎬 Filmer';btn.style.background='red'}}
function closePreview(){document.getElementById('previewBox').style.display='none'}
function shareMedia(){closePreview();openChat('Séverine');let div=document.createElement('div');div.className='msg me';if(lastCapturedType=='image')div.innerHTML='📸 Photo<div><img src="'+lastCapturedUrl+'"></div>';else div.innerHTML='🎥 Vidéo<div><video src="'+lastCapturedUrl+'" controls></video></div>';document.getElementById('msgs').appendChild(div);document.getElementById('msgs').scrollTop=9999;document.getElementById('last').innerText=lastCapturedType=='image'?'📸 Photo':'🎥 Vidéo';alert('✅ Partagé dans le chat!')}
function shareFile(input){let file=input.files[0];if(!file)return;let url=URL.createObjectURL(file);let isImg=file.type.startsWith('image');let div=document.createElement('div');div.className='msg me';if(isImg)div.innerHTML='📸 Image<div><img src="'+url+'"></div>';else div.innerHTML='🎥 Vidéo<div><video src="'+url+'" controls></video></div>';document.getElementById('msgs').appendChild(div);document.getElementById('msgs').scrollTop=9999}
function openChat(name){document.getElementById('chatName').innerText=name;document.getElementById('chatWin').style.display='flex'}
function closeChat(){document.getElementById('chatWin').style.display='none'}
function sendMsg(){let t=document.getElementById('txt');if(!t.value)return;let m=document.createElement('div');m.className='msg me';m.innerText=t.value;document.getElementById('msgs').appendChild(m);t.value="";document.getElementById('msgs').scrollTop=9999}
async function recVocal(){let btn=document.getElementById('micBtn');if(mediaRec&&mediaRec.state=="recording"){mediaRec.stop();btn.innerText="🎤";return}try{let s=await navigator.mediaDevices.getUserMedia({audio:true});mediaRec=new MediaRecorder(s);audioChunks=[];mediaRec.ondataavailable=e=>audioChunks.push(e.data);mediaRec.onstop=()=>{let blob=new Blob(audioChunks,{type:'audio/webm'});let url=URL.createObjectURL(blob);let div=document.createElement('div');div.className='msg me';div.innerHTML='🎤 Vocal <audio controls src="'+url+'"></audio>';document.getElementById('msgs').appendChild(div);s.getTracks().forEach(t=>t.stop())};mediaRec.start();btn.innerText="⏹️"}catch(e){alert("Autorise micro")}}
function endCall(){clearInterval(callInt);document.getElementById('callScreen').style.display='none'}
</script></body></html>
