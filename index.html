<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat Ivoire</title>
<style>
body{margin:0;font-family:Arial;background:#f2f2f2;display:flex;flex-direction:column;height:100vh}
header{background:#ff8c00;color:white;padding:15px;display:flex;justify-content:space-between}
#messages{flex:1;overflow-y:auto;padding:10px;list-style:none;padding-bottom:80px}
#messages li{padding:8px 12px;background:white;margin:5px;border-radius:10px}
#form{display:flex;gap:8px;padding:10px;background:white;position:fixed;bottom:0;left:0;right:0;border-top:1px solid #ddd}
#input{flex:1;padding:14px;border:2px solid #ff8c00;border-radius:25px;font-size:16px;outline:none}
#form button{width:100px;background:#ff8c00;color:white;border:none;border-radius:25px;font-weight:bold}
#login{max-width:350px;margin:50px auto;background:white;padding:20px;border-radius:10px}
#login input{width:90%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px}
</style>
</head>
<body>
<div id="login">
<h2 style="color:#ff8c00;text-align:center">🇨🇮 Chat Ivoire</h2>
<input id="username" placeholder="Ton pseudo">
<input id="email" placeholder="Email" type="email">
<input id="password" placeholder="Mot de passe" type="password">
<button onclick="register()" style="width:100%;padding:12px;background:#ff8c00;color:white;border:none;border-radius:8px;margin-top:10px">S'inscrire</button>
<button onclick="login()" style="width:100%;padding:12px;background:white;color:#ff8c00;border:2px solid #ff8c00;border-radius:8px;margin-top:10px">Se connecter</button>
</div>
<div id="chat" style="display:none;flex-direction:column;height:100vh">
<header><span id="me"></span><button onclick="logout()" style="background:white;color:#ff8c00;border:none;padding:5px 10px;border-radius:5px">Déconnexion</button></header>
<ul id="messages"></ul>
<form id="form"><input id="input" autocomplete="off" placeholder="Tape ton message ici..." /><button>Envoyer</button></form>
</div>
<script src="/socket.io/socket.io.js"></script>
<script>
let token=localStorage.getItem('token'),user=null,socket;
const loginDiv=document.getElementById('login'),chatDiv=document.getElementById('chat');
function showChat(){loginDiv.style.display='none';chatDiv.style.display='flex';document.getElementById('me').textContent='👤 '+user.username;socket=io({auth:{token}});socket.on('chat message',m=>{let li=document.createElement('li');li.textContent=m.user+': '+m.text;document.getElementById('messages').appendChild(li)});}
if(token){fetch('/api/me',{headers:{Authorization:'Bearer '+token}}).then(r=>r.json()).then(d=>{if(d.username){user=d;showChat()}})}
async function register(){let u=document.getElementById('username').value,e=document.getElementById('email').value,p=document.getElementById('password').value;let r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,email:e,password:p})});let d=await r.json();if(d.token){token=d.token;user=d.user;localStorage.setItem('token',token);showChat()}else alert(d.error)}
async function login(){let e=document.getElementById('email').value,p=document.getElementById('password').value;try{let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:e,password:p})});let d=await r.json();if(d.token){token=d.token;user=d.user;localStorage.setItem('token',token);showChat()}else alert(d.error||'Faux email/mot de passe')}catch(err){alert('Serveur se réveille, attends 30s et re-clique')}}
function logout(){localStorage.clear();location.reload()}
document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();let t=document.getElementById('input').value;if(t){socket.emit('chat message',t);document.getElementById('input').value=''}})
</script>
</body>
</html>
